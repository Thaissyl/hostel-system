<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Listing - HostelVN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Source Sans 3', sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Lexend', sans-serif; }
  </style>
</head>
<body class="bg-slate-50">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <a href="#" class="text-primary-600 hover:text-primary-700 text-sm font-medium cursor-pointer">← Back to Listings</a>
        <h1 class="text-2xl font-bold text-slate-900 mt-2">Edit Listing</h1>
      </div>
      <div class="flex gap-3">
        <button class="px-4 py-2 border border-slate-300 text-slate-700 font-medium rounded-lg hover:bg-slate-50 cursor-pointer">Cancel</button>
        <button class="px-6 py-2 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 cursor-pointer">Save Changes</button>
      </div>
    </div>

    <!-- Form -->
    <form class="space-y-8">
      <!-- Basic Information -->
      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-6">Basic Information</h2>

        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Property Name *</label>
            <input type="text" value="Saigon Backpackers Hostel" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Property Type *</label>
            <select class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
              <option>Hostel</option>
              <option>Guesthouse</option>
              <option>Homestay</option>
              <option>Boutique Hotel</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Description *</label>
            <textarea rows="4" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">Located in the heart of Ho Chi Minh City, Saigon Backpackers Hostel offers clean and comfortable accommodation with a vibrant social atmosphere.</textarea>
            <p class="mt-1 text-sm text-slate-500">Minimum 50 characters</p>
          </div>
        </div>
      </div>

      <!-- Location -->
      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-6">Location</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-2">Address *</label>
            <input type="text" value="123 Bui Vien Street, District 1" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">City *</label>
            <input type="text" value="Ho Chi Minh City" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Postal Code</label>
            <input type="text" value="700000" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
          </div>
        </div>
      </div>

      <!-- Amenities -->
      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-6">Amenities</h2>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <label class="flex items-center gap-3 p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="checkbox" checked class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500">
            <span class="text-sm text-slate-700">Free WiFi</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="checkbox" checked class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500">
            <span class="text-sm text-slate-700">Air Conditioning</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="checkbox" checked class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500">
            <span class="text-sm text-slate-700">Breakfast</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="checkbox" checked class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500">
            <span class="text-sm text-slate-700">Security Lockers</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="checkbox" class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500">
            <span class="text-sm text-slate-700">Airport Pickup</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50">
            <input type="checkbox" class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500">
            <span class="text-sm text-slate-700">Bike Rental</span>
          </label>
        </div>
      </div>

      <!-- Photos -->
      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-6">Photos</h2>

        <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center">
          <svg class="w-12 h-12 text-slate-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <p class="text-slate-600 mb-2">Drag and drop photos here, or click to browse</p>
          <p class="text-sm text-slate-500">PNG, JPG up to 10MB each</p>
          <button class="mt-4 px-4 py-2 bg-primary-500 text-white text-sm font-medium rounded-lg hover:bg-primary-600 cursor-pointer">Choose Files</button>
        </div>

        <div class="mt-6 grid grid-cols-4 gap-4">
          <div class="relative aspect-square rounded-lg overflow-hidden group">
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=200" alt="Photo" class="w-full h-full object-cover">
            <button class="absolute top-2 right-2 p-1 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 cursor-pointer">×</button>
          </div>
        </div>
      </div>

      <!-- Policies -->
      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-6">House Rules & Policies</h2>

        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Check-in Time *</label>
            <input type="time" value="14:00" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Check-out Time *</label>
            <input type="time" value="11:00" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Cancellation Policy</label>
            <select class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500">
              <option>Flexible - Free cancellation 48h before</option>
              <option>Moderate - Free cancellation 24h before</option>
              <option>Strict - 50% refund up to 7 days before</option>
            </select>
          </div>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
