<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings - HostelVN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Source Sans 3', sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Lexend', sans-serif; }
  </style>
</head>
<body class="bg-slate-50">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="hidden lg:flex lg:flex-col w-64 bg-slate-900 text-slate-300 flex-shrink-0">
      <div class="p-6"><a href="#" class="text-2xl font-bold text-white">HostelVN</a></div>
      <nav class="flex-1 px-4">
        <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg font-medium cursor-pointer">Dashboard</a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 bg-slate-800 text-white rounded-lg font-medium cursor-pointer">My Listings</a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg font-medium cursor-pointer">Calendar</a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg font-medium cursor-pointer">Bookings</a>
      </nav>
    </aside>

    <div class="flex-1 p-8">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">My Listings</h1>
          <p class="text-slate-500">Manage your hostel listings</p>
        </div>
        <button class="px-6 py-3 bg-primary-500 text-white font-medium rounded-lg hover:bg-primary-600 cursor-pointer flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
          Add New Listing
        </button>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-xl border border-slate-200 p-4 mb-6">
        <div class="flex flex-wrap gap-4">
          <div class="flex-1 min-w-[200px]">
            <input type="text" placeholder="Search listings..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500">
          </div>
          <select class="px-4 py-2 border border-slate-300 rounded-lg">
            <option>All Status</option>
            <option>Active</option>
            <option>Inactive</option>
          </select>
          <select class="px-4 py-2 border border-slate-300 rounded-lg">
            <option>Sort by: Newest</option>
            <option>Sort by: Oldest</option>
            <option>Sort by: Name</option>
          </select>
        </div>
      </div>

      <!-- Listings Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Listing Card 1 -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
          <div class="relative aspect-[4/3]">
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400" alt="Hostel" class="w-full h-full object-cover">
            <span class="absolute top-3 right-3 px-2 py-1 bg-success-500 text-white text-xs font-semibold rounded-full">Active</span>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-slate-900 mb-1">Saigon Backpackers</h3>
            <p class="text-sm text-slate-500 mb-3">District 1, Ho Chi Minh City</p>
            <div class="flex items-center gap-4 text-sm mb-4">
              <span class="flex items-center gap-1">
                <svg class="w-4 h-4 text-warning-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                4.8 (127)
              </span>
              <span class="text-slate-600">$12/night</span>
            </div>
            <div class="flex gap-2">
              <button class="flex-1 px-3 py-2 bg-primary-50 text-primary-700 text-sm font-medium rounded-lg hover:bg-primary-100 cursor-pointer">Edit</button>
              <button class="flex-1 px-3 py-2 border border-slate-300 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 cursor-pointer">Calendar</button>
            </div>
          </div>
        </div>

        <!-- Listing Card 2 -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
          <div class="relative aspect-[4/3]">
            <img src="https://images.unsplash.com/photo-1584132967334-10e028bd69f7?w=400" alt="Hostel" class="w-full h-full object-cover">
            <span class="absolute top-3 right-3 px-2 py-1 bg-success-500 text-white text-xs font-semibold rounded-full">Active</span>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-slate-900 mb-1">Hanoi Old Quarter</h3>
            <p class="text-sm text-slate-500 mb-3">Hoan Kiem, Hanoi</p>
            <div class="flex items-center gap-4 text-sm mb-4">
              <span class="flex items-center gap-1">
                <svg class="w-4 h-4 text-warning-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                4.9 (89)
              </span>
              <span class="text-slate-600">$10/night</span>
            </div>
            <div class="flex gap-2">
              <button class="flex-1 px-3 py-2 bg-primary-50 text-primary-700 text-sm font-medium rounded-lg hover:bg-primary-100 cursor-pointer">Edit</button>
              <button class="flex-1 px-3 py-2 border border-slate-300 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 cursor-pointer">Calendar</button>
            </div>
          </div>
        </div>

        <!-- Listing Card 3 - Inactive -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition-shadow opacity-75">
          <div class="relative aspect-[4/3]">
            <img src="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=400" alt="Hostel" class="w-full h-full object-cover grayscale">
            <span class="absolute top-3 right-3 px-2 py-1 bg-slate-500 text-white text-xs font-semibold rounded-full">Inactive</span>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-slate-900 mb-1">Da Nang Beach House</h3>
            <p class="text-sm text-slate-500 mb-3">My Khe Beach, Da Nang</p>
            <div class="flex items-center gap-4 text-sm mb-4">
              <span class="text-slate-400">Suspended</span>
            </div>
            <div class="flex gap-2">
              <button class="flex-1 px-3 py-2 border border-slate-300 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 cursor-pointer">Reactivate</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
